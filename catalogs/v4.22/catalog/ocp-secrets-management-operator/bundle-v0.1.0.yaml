        version: v1alpha1
    description: |
      ## External Secrets Management Console

      The External Secrets Management Console operator provides a unified OpenShift Console plugin for managing
      secrets-related Custom Resources from multiple operators:

      * **cert-manager** - Certificates, Issuers, ClusterIssuers
      * **External Secrets Operator (ESO)** - ExternalSecrets, SecretStores, PushSecrets
      * **Secrets Store CSI Driver** - SecretProviderClasses

      ### Features

      * **Unified Dashboard** - View all secrets-related resources in one place
      * **Operator Detection** - Automatically detects which operators are installed
      * **RBAC Management** - Creates default ClusterRoles for view, delete, and admin access
      * **Flexible Configuration** - Enable/disable features and operators via CRD

      ### Prerequisites

      * OpenShift 4.22 or later
      * One or more of the supported operators installed (optional)

      ### Getting Started

      After installing the operator, it will automatically:
      1. Create a default `SecretsManagementConfig` resource
      2. Create default RBAC ClusterRoles
      3. Deploy the console plugin
      4. Register the plugin with OpenShift Console
      5. Detect installed operators

      No manual configuration is required. The console plugin will appear automatically after installation.

      To customize the configuration, edit the auto-created `SecretsManagementConfig` resource:

      ```yaml
      apiVersion: secrets-management.openshift.io/v1alpha1
      kind: SecretsManagementConfig
      metadata:
        name: cluster
      spec:
        rbac:
          createDefaultRoles: true
        plugin:
          replicas: 1
      ```
