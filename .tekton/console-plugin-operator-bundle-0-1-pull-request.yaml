apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/ocp-secrets-management-console?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "release-0.1"
  labels:
    appstudio.openshift.io/application: console-plugin-operator-bundle-0-1
    appstudio.openshift.io/component: console-plugin-operator-bundle-0-1
    pipelines.appstudio.openshift.io/type: build
  name: console-plugin-operator-bundle-0-1-on-pull-request
  namespace: secrets-management-console-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/secrets-management-console-tenant/console-plugin-operator-bundle-0-1/console-plugin-operator-bundle-0-1:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: operator/Containerfile.ocp-secrets-management-operator-bundle
  - name: path-context
    value: .
  - name: build-args
    value:
      - RELEASE_VERSION=v0.1.0
      - COMMIT_SHA={{revision}}
      - SOURCE_URL={{source_url}}
  - name: build-source-image
    value: "true"
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: '{"type": "gomod", "path": "."}'
  pipelineRef:
    name: single-arch-build-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-console-plugin-operator-bundle-0-1
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
