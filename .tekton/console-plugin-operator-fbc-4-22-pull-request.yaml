apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/ocp-secrets-management-console?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main" && ( "catalogs/v4.22/***".pathChanged() || ".tekton/console-plugin-operator-fbc-4-22-pull-request.yaml".pathChanged()
      || ".tekton/fbc-build-pipeline.yaml".pathChanged() || "catalogs/v4.22/Containerfile".pathChanged() )
  labels:
    appstudio.openshift.io/application: console-plugin-operator-fbc-4-22
    appstudio.openshift.io/component: console-plugin-operator-fbc-4-22
    pipelines.appstudio.openshift.io/type: build
  name: console-plugin-operator-fbc-4-22-on-pull-request
  namespace: secrets-management-console-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/secrets-management-console-tenant/console-plugin-operator-fbc-4-22/console-plugin-operator-fbc-4-22:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: build-platforms
    value:
    - linux/x86_64
  - name: dockerfile
    value: catalogs/v4.22/Containerfile
  - name: path-context
    value: catalogs/v4.22
  pipelineRef:
    name: fbc-build-pipeline
  taskRunTemplate:
    serviceAccountName: build-pipeline-console-plugin-operator-fbc-4-22
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
