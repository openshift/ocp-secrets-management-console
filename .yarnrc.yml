enableInlineBuilds: true

enableScripts: false

enableTelemetry: false

# A 10-minute (600000ms) timeout previously here meant a single stalled
# request (as seen intermittently on the s390x/arm64 Konflux remote
# builders, which proxy npm registry traffic through squid.caching) had to
# fully hang for 10 minutes before failing, using up most/all of httpRetry's
# attempts and leaving little time to succeed via a fresh connection. A
# shorter per-attempt timeout combined with more retries fails fast and
# reconnects instead, which is more resilient to a flaky proxied network.
httpTimeout: 60000
httpRetry: 5
networkConcurrency: 16

nodeLinker: node-modules

supportedArchitectures:
  cpu:
    - x64
    - arm64
    - s390x
    - ppc64
  os:
    - linux
    - darwin

yarnPath: .yarn/releases/yarn-4.18.0.cjs
